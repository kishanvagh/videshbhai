# Render Blueprint (optional) – auto-configures the backend web service.
# You can also skip this file and create the service manually in the Render dashboard.
services:
  - type: web
    name: videshbhai-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ALLOW_REGISTRATION
        value: "false"
      # Set these in the Render dashboard (Service -> Environment) — sync: false
      # means Render won't try to generate a value:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
